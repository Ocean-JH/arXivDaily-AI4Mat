<article class="paper"
         id="{anchor}"
         data-paper-id="{base_id}"
         aria-labelledby="title-{anchor}"
         tabindex="-1">
    <div class="paper-index" aria-hidden="true">{index}</div>
    <div class="paper-body">
        <h3 id="title-{anchor}" class="paper-title"><a href="{url}" target="_blank" rel="noopener noreferrer">{title}</a>{tag}</h3>

        <dl class="paper-info">
            <div class="paper-authors">
                <dt>Authors</dt>
                <dd>{authors}</dd>
            </div>
            <div class="paper-date">
                <dt>Published</dt>
                <dd><time datetime="{published_iso}">{published_date}</time></dd>
            </div>
            <div class="paper-category">
                <dt>Category</dt>
                <dd>{category}</dd>
            </div>
            <div class="paper-id">
                <dt>arXiv ID</dt>
                <dd>{paper_id}</dd>
            </div>
        </dl>

        <div class="paper-actions">
            <a href="{url}" target="_blank" rel="noopener noreferrer">Open on arXiv <span aria-hidden="true">↗</span></a>
        </div>

        <details class="paper-summary">
            <summary>Read abstract</summary>
            <p>{summary}</p>
        </details>
    </div>
</article>
